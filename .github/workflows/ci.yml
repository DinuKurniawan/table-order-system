name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Audit penuh mingguan (informatif, tidak memblokir merge).
    - cron: "0 3 * * 1"

jobs:
  audit-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit penuh (informatif)
        run: npm audit || true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coffeeshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      s3mock:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: coffeeshop-public,coffeeshop-private
        ports:
          - 9090:9090

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coffeeshop?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/coffeeshop?schema=public
      APP_BASE_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      CRON_SECRET: ci-cron-secret-0123456789abcdefghijklmnop
      # SEC-01: seed tidak punya kredensial default; CI memakai nilai khusus ini.
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: CiAdminPass-9f3a72
      # SEC-13: production build/start wajib menyatakan topologi proxy.
      TRUSTED_PROXY: none
      R2_ACCOUNT_ID: http://localhost:9090
      R2_ACCESS_KEY_ID: s3mock
      R2_SECRET_ACCESS_KEY: s3mock-secret
      R2_BUCKET_PUBLIC: coffeeshop-public
      R2_BUCKET_PRIVATE: coffeeshop-private
      R2_PUBLIC_BASE_URL: http://localhost:9090/coffeeshop-public
      R2_FORCE_PATH_STYLE: "true"
      PUSHER_APP_ID: ci-disabled
      PUSHER_KEY: ci-disabled
      PUSHER_SECRET: ci-disabled
      PUSHER_CLUSTER: ap1
      NEXT_PUBLIC_PUSHER_KEY: ci-disabled
      NEXT_PUBLIC_PUSHER_CLUSTER: ap1
      DISABLE_REALTIME: "true"
      CI: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Audit dependencies runtime (high)
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run db:seed

      # E2E login sebagai admin seed. Gate wajib-ganti-sandi diuji di
      # tests/seed-and-password-change.test.ts, jadi akun CI dibuka di sini.
      - name: Siapkan admin E2E (lewati gate ganti sandi)
        run: |
          npx tsx --conditions=react-server -e 'import { PrismaClient } from "@prisma/client"; (async () => { const p = new PrismaClient(); await p.user.update({ where: { username: process.env.SEED_ADMIN_USERNAME }, data: { mustChangePassword: false } }); await p.$disconnect(); })();'

      - name: Wait for S3Mock
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:9090/favicon.ico > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "S3Mock tidak siap" >&2
          exit 1

      - run: node scripts/init-buckets.mjs

      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:unit
      - run: npm run build

      - name: E2E (Playwright)
        run: npx playwright test

      - name: Lighthouse menu (mobile)
        run: |
          npm start &
          for i in {1..60}; do
            curl -sf http://localhost:3000/login > /dev/null && break
            sleep 1
          done
          npm run lighthouse:menu
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-results/
            playwright-report/
            lighthouse-menu.json
            lighthouse.log
          if-no-files-found: ignore
